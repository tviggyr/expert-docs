site_name: Expert24 Documentation
site_description: Документація проєкту Expert24
site_url: https://tviggyr.github.io/expert-docs/
theme:
  name: material
  language: uk
  features:
  - navigation.sections
  - navigation.expand
  - navigation.top
  - search.suggest
  - search.highlight
  - navigation.footer
  custom_dir: overrides
  palette:
  - scheme: default
    primary: indigo
    accent: blue
    toggle:
      icon: material/weather-night
      name: Увімкнути темну тему
  - scheme: slate
    primary: indigo
    accent: blue
    toggle:
      icon: material/weather-sunny
      name: Увімкнути світлу тему
plugins:
- search
nav:
- Головна: index.md
- Модулі Magento:
  - Аксесуари:
    - Огляд: published/backend/accessories/index.md
    - Посібники користувача:
      - Керування правилами аксесуарів: published/backend/accessories/accessories-guide.md
    - Інші документи:
      - 'Аксесуари: черга ручної переіндексації': published/backend/accessories/PHASE-2C.md
      - 'Аксесуари: automatic invalidation': published/backend/accessories/PHASE-2D.md
  - Схожі товари:
    - Огляд: published/backend/similar-products/index.md
    - Посібники користувача:
      - Схожі товари: published/backend/similar-products/similar_products.md
    - Інші документи:
      - 'Expert Similar Products — PHASE 1: конфігурація правил': published/backend/similar-products/PHASE-1.md
      - 'Expert Similar Products — PHASE 2: Magento Admin': published/backend/similar-products/PHASE-2.md
      - 'Expert Similar Products — PHASE 3: відбір кандидатів і розрахунок схожості': published/backend/similar-products/PHASE-3.md
      - PHASE 4 — постійний індекс схожих товарів: published/backend/similar-products/PHASE-4.md
      - PHASE 5 — Runtime PDP «Схожі товари»: published/backend/similar-products/PHASE-5.md
      - PHASE 6 — Runtime Rotation «Схожі товари»: published/backend/similar-products/PHASE-6.md
  - Cортування товарів:
    - Огляд: published/backend/catalog/sorting/index.md
    - Посібники користувача:
      - Сортування товарів: published/backend/catalog/sorting/Sorting.md
