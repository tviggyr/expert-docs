    - title: Аксесуари
      url: published/backend/accessories/
      groups: &id001
      - title: Посібники користувача
        key: Посібники користувача|published/backend/accessories/accessories-guide-with-flow.md
        pages:
        - title: Керування правилами аксесуарів
          description: Покрокова інструкція для менеджера
