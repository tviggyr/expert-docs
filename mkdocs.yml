          url: published/backend/accessories/accessories-guide-with-flow/
    - title: Схожі товари
      url: published/backend/similar-products/
      groups: &id002
      - title: Посібники користувача
        key: Посібники користувача|published/backend/similar-products/similar_products.md
        pages:
        - title: Схожі товари
          description: Покрокова інструкція для менеджера
