site_name: Expert24 Documentation
site_description: Документація проєкту Expert24
site_url: https://tviggyr.github.io/expert-docs/
theme:
  name: material
  language: uk
  features:
  - navigation.sections
  - navigation.expand
  - navigation.top
  - search.suggest
  - search.highlight
  - navigation.footer
  custom_dir: overrides
  palette:
  - scheme: default
    primary: indigo
    accent: blue
    toggle:
      icon: material/weather-night
      name: Увімкнути темну тему
  - scheme: slate
    primary: indigo
    accent: blue
    toggle:
      icon: material/weather-sunny
      name: Увімкнути світлу тему
plugins:
- search
markdown_extensions:
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format ''
nav:
- Головна: index.md
- Модулі Magento:
  - Аксесуари:
    - Огляд: published/backend/accessories/index.md
    - Посібники користувача:
      - Керування правилами аксесуарів: published/backend/accessories/accessories-guide-with-flow.md
  - Схожі товари:
    - Огляд: published/backend/similar-products/index.md
    - Посібники користувача:
      - Схожі товари: published/backend/similar-products/similar_products.md
  - Cортування товарів:
    - Огляд: published/backend/catalog/sorting/index.md
    - Посібники користувача:
      - Сортування каталогу товарів: published/backend/catalog/sorting/Sorting.md
extra_css:
- assets/portal.css
extra_javascript:
- https://unpkg.com/mermaid@11.12.2/dist/mermaid.min.js
- assets/mermaid.js
- assets/portal.js
extra:
  portal_sections:
  - title: Аксесуари
    description: Правила сумісності та керування аксесуарами
    page_count: 3
    url: published/backend/accessories/PHASE-2C/
  - title: Схожі товари
    description: Налаштування автоматичного підбору товарів
    page_count: 6
    url: published/backend/similar-products/PHASE-1/
  portal_breadcrumbs:
    published/backend/accessories/accessories-guide-with-flow/:
    - title: Головна
      url: ''
    - title: Аксесуари
      url: published/backend/accessories/
    - title: Керування правилами аксесуарів
      url: ''
    published/backend/accessories/:
    - title: Головна
      url: ''
    - title: Аксесуари
      url: ''
    published/backend/similar-products/similar_products/:
    - title: Головна
      url: ''
    - title: Схожі товари
      url: published/backend/similar-products/
    - title: Схожі товари
      url: ''
    published/backend/similar-products/:
    - title: Головна
      url: ''
    - title: Схожі товари
      url: ''
    published/backend/catalog/sorting/Sorting/:
    - title: Головна
      url: ''
    - title: Cортування товарів
      url: published/backend/catalog/sorting/
    - title: Сортування каталогу товарів
      url: ''
    published/backend/catalog/sorting/:
